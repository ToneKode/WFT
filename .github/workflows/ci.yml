name: CI

on:
  push:
    branches: [main, dev/phase1]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      # build-essential provides gcc. Pin it so a runner image whose default
      # c++ is clang cannot select a different toolchain than the one installed.
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v4

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config zip unzip

      # Clone before the cache restore. Restoring downloads into
      # $VCPKG_ROOT/downloads creates that directory, and git clone refuses a
      # non-empty destination, so a cache hit used to fail the next run.
      - name: Clone vcpkg
        run: |
          if [ ! -d "$VCPKG_ROOT/.git" ]; then
            git clone --depth 1 https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          fi

      - uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/vcpkg-cache
            ${{ env.VCPKG_ROOT }}/downloads
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      # curl[websockets] and nlohmann_json both come from vcpkg.json.
      # runner.temp is not a valid context in a job-level env block (GitHub
      # rejects the workflow before any job starts), so publish the cache
      # directory from this step. RUNNER_TEMP is the same path.
      - name: Bootstrap vcpkg
        run: |
          mkdir -p "$RUNNER_TEMP/vcpkg-cache"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-cache" >> "$GITHUB_ENV"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure
        run: cmake --preset default -DWFT_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset default

      - name: Test
        run: ctest --preset default

  windows:
    name: Build and test (Windows / MinGW + vcpkg)
    runs-on: windows-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      # Keep these as Windows paths inside the MSYS2 shell. Converted unix
      # paths are not usable by vcpkg.exe.
      MSYS2_ENV_CONV_EXCL: VCPKG_ROOT;VCPKG_DEFAULT_BINARY_CACHE
    steps:
      - uses: actions/checkout@v4

      - name: Install MSYS2 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Clone vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:VCPKG_ROOT/.git")) {
            git clone --depth 1 https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          }

      - uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/vcpkg-cache
            ${{ env.VCPKG_ROOT }}/downloads
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      # Dependencies come from the manifest, so WebSockets cannot be forgotten.
      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP "vcpkg-cache"
          New-Item -ItemType Directory -Force $cache | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$cache" >> $env:GITHUB_ENV
          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure
        shell: msys2 {0}
        run: cmake --preset default -DWFT_WARNINGS_AS_ERRORS=ON

      - name: Build
        shell: msys2 {0}
        run: cmake --build --preset default

      - name: Test
        shell: msys2 {0}
        run: ctest --preset default
